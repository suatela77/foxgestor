name: Servidor Gestor Fox
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/pedido-servidor.txt']
permissions:
  contents: read
jobs:
  copia:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: frwzzselizszeuvqldrs
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.54.11
      - name: Copiar funções e banco (criptografado)
        run: |
          set -e
          mkdir -p out/functions
          curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$REF/functions" > out/functions.json
          echo "Funções encontradas:"; jq -r '.[].slug' out/functions.json
          cd out
          for f in $(jq -r '.[].slug' functions.json); do supabase functions download "$f" --project-ref "$REF" --use-api >/dev/null 2>&1 || supabase functions download "$f" --project-ref "$REF" >/dev/null 2>&1 || echo "falhou: $f"; done
          cd ..
          q() { jq -n --arg q "$1" '{query:$q}' | curl -sf -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" "https://api.supabase.com/v1/projects/$REF/database/query" -d @- ; }
          q "select n.nspname, p.proname, pg_get_functiondef(p.oid) def from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname in ('public') and p.prokind='f'" > out/sql_funcoes.json || echo "falhou sql funcoes"
          q "select jobid, schedule, command, jobname, active from cron.job" > out/cron.json || echo "sem cron"
          q "select table_name, column_name, data_type from information_schema.columns where table_schema='public' order by table_name, ordinal_position" > out/colunas.json || true
          q "select key from public.fox_state limit 0" > /dev/null 2>&1 || true
          tar czf copia.tgz out
          openssl rand -hex 32 > k.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in copia.tgz -out copia.tgz.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey .github/chave/pub.pem -in k.txt -out k.enc
          rm -rf out copia.tgz k.txt
      - uses: actions/upload-artifact@v4
        with:
          name: copia
          path: |
            copia.tgz.enc
            k.enc
          retention-days: 1
