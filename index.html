<style>
:root{--orange:#ff6a00;--red:#ff1a1a;--bg:#0a0a0a;--card:#151515;--border:#232323}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{background:var(--bg);color:#fff;min-height:100vh}
header{height:64px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#111}
.logo{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:-0.02em}
.logo i{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--orange),var(--red));display:grid;place-items:center;font-style:normal}
.badge{font-size:11px;padding:4px 10px;border-radius:999px;background:#ff6a0015;border:1px solid #ff6a0030;color:#ff8a33;font-weight:700;letter-spacing:0.1em}
main{max-width:1100px;margin:0 auto;padding:32px 20px}
.grid{display:grid;grid-template-columns:1fr 320px;gap:20px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px}
h1{font-size:32px;font-weight:900;letter-spacing:-0.03em;margin-bottom:8px}
h1 span{background:linear-gradient(90deg,var(--orange),var(--red));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.table{width:100%;border-collapse:collapse;margin-top:16px}
.table th{font-size:11px;text-transform:uppercase;letter-spacing:0.12em;color:#888;text-align:left;padding:10px 12px;border-bottom:1px solid var(--border)}
.table td{padding:12px;font-size:14px;border-bottom:1px solid #1a1a1a}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
.btn-danger{background:linear-gradient(135deg,#ff1a1a,#ff4d4d);color:#fff}
.btn-ghost{background:#1f1f1f;color:#aaa;border:1px solid #2a2a2a}
.footer{position:fixed;bottom:0;left:0;right:0;height:56px;background:#111;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:flex-end;padding:0 24px;gap:12px}
.footer .only-sair{background:#fff;color:#000;border-radius:10px;padding:10px 18px;font-weight:800}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;place-items:center;z-index:50}
.modal.active{display:grid}
.modal-box{background:#18181b;border:1px solid #2a2a2e;border-radius:16px;padding:24px;max-width:400px;width:90%}

<div class="grid">
<div class="card">

<thead><tr><th>Nome</th><th>Status</th><th>Ação</th></tr></thead>
<tbody>
<tr><td>Cliente Demo 01</td><td><span style="color:#22c55e">● Ativo</span></td><td><button class="btn btn-danger" onclick="confirmDelete('Cliente Demo 01')">Delete</button></td></tr>
<tr><td>Cliente Demo 02</td><td><span style="color:#22c55e">● Ativo</span></td><td><button class="btn btn-danger" onclick="confirmDelete('Cliente Demo 02')">Delete</button></td></tr>
<tr><td>Cliente Demo 03</td><td><span style="color:#f59e0b">● Pendente</span></td><td><button class="btn btn-danger" onclick="confirmDelete('Cliente Demo 03')">Delete</button></td></tr>
</tbody>
</table>
</div>
<div class="card">
<h3 style="font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#aaa;margin-bottom:12px">Log Blindado</h3>
<div id="log" style="font-family:monospace;font-size:11px;color:#666;line-height:1.6">
[14:22] Sistema iniciado v29.00<br>
[14:23] Delete blindado ativo<br>
[14:23] Footer = só Sair<br>
</div>
</div>
</div>
</main>

<button class="only-sair" onclick="alert('Saindo...')">Sair</button>
</div>
<div id="modal" class="modal">
<div class="modal-box">
<h3 style="font-size:18px;font-weight:800;margin-bottom:8px">Confirmar DELETE blindado?</h3>
<p style="font-size:13px;color:#999;line-height:1.5;margin-bottom:16px">Essa ação é blindada. Digite <b style="color:#fff">DELETE</b> para confirmar a exclusão de <span id="targetName" style="color:#ff6a00"></span>.</p>

<div style="display:flex;gap:10px;justify-content:flex-end">
<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
<button class="btn btn-danger" onclick="executeDelete()">Confirmar Delete</button>
</div>
</div>
</div>
<script>
let pending=null;
function confirmDelete(name){pending=name;document.getElementById('targetName').textContent=name;document.getElementById('modal').classList.add('active');document.getElementById('confirmInput').value='';document.getElementById('confirmInput').focus()}

<\/script>
